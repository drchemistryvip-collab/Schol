<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سیستەمێ بەلاڤکرنێ</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <meta name="color-scheme" content="dark">
    <link rel="apple-touch-icon" href="icon-192.html">
    <link rel="stylesheet" href="wenastyle.css">
</head>
<body class="admin-page">
    <main id="app-content" style="display: none;">
        <header>
            <h1>سیستەمێ بەلاڤکرنێ</h1>
            <div id="auth-status">گرێدان...</div>
        </header>

        <div class="view-book-link">
            <a href="book.html?fullscreen=true" target="_blank">بینینا پەرتووکێ ل لاپەرەکا نوو</a>
        </div>

        <!-- === پشکا زێدەکرنا پۆستێ نوو === -->
        <div class="form-container">
            <h2>پۆستەکا نوو زێدە بکە</h2>
            <form id="singlePostForm">
                <label for="postId">ژمارا پۆستێ (ID):</label>
                <input type="number" id="postId" placeholder="بۆ نموونە: 101" required>
                
                <label for="primaryImageFile">وێنەیێ سەرەکی:</label>
                <input type="file" id="primaryImageFile" accept="image/*" required>

                <label for="postText">نڤیسین:</label>
                <textarea id="postText" rows="4" placeholder="نڤیسینا خۆ ل ڤێرێ بنڤیسە..."></textarea>
                
                <label for="secondImageFile">وێنەیێ دووەم (ئختیاری):</label>
                <input type="file" id="secondImageFile" accept="image/*">
                
                <button type="submit">بەلاڤ بکە</button>
            </form>
        </div>
        <hr>

        <!-- === پشکا بلندکرنا ب کۆم === -->
        <div class="form-container">
            <h2>بلندکرنا ب کۆم ب رێکا ئێکسێلی (Excel)</h2>
             <p><b>رێنمایی:</b><br>1. وێنەیان بلند بکە ناڤ فۆلدەرا "images".<br>2. ئێکسێلەکێ ب ستوونا (id) دروست بکە.<br>3. فایلێ ل خوارێ بلند بکە.</p>
            <form id="excelUploadForm">
                <label for="excelFile">فایلا Excel (.xlsx) هەلبژێرە:</label>
                <input type="file" id="excelFile" accept=".xlsx, .xls" required>
                <button type="submit">داتایان بلند بکە</button>
            </form>
            <div id="uploadStatus"></div>
        </div>
        <hr>

        <!-- === پشکا ڕێڤەبرنا پۆستان === -->
        <div class="form-container" id="postManagement">
            <h2>ڕێڤەبرنا پۆستان</h2>
            <div id="findPostContainer">
                <label for="findPostId">ژمارا پۆستێ (ID) بنڤیسە بۆ گوهۆڕین یان ژێبرنێ:</label>
                <input type="number" id="findPostId" placeholder="ID ya پۆستی...">
                <button id="fetchPostBtn">دیتنا پۆستی</button>
            </div>
            <div id="postDetailsContainer" style="display: none;">
            </div>
             <div id="managementStatus"></div>
        </div>

    </main>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-storage.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-database.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.0/xlsx.full.min.js"></script>
    <script src="firebase-config.js"></script>
    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js'); }); }
    </script>
</body>
</html>
