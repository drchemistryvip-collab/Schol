<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چوونا ژوور</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" style="max-width: 450px;">
        <div id="login-modal" class="modal-overlay" style="display: flex; position: static; background: none;">
            <div class="modal-content">
                <h2 class="modal-header">چوونا ژوور</h2>
                <form id="login-form">
                    <div class="form-group">
                        <label for="email">ئیمەیل</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="form-group">
                        <label for="password">تێپەڕەوشە</label>
                        <input type="password" id="password" required>
                    </div>
                    <p id="login-error" class="error-text"></p>
                    <div class="form-actions">
                        <button type="submit" class="btn-save">داخل ببە</button>
                    </div>
                </form>

                <div style="margin: 18px 0; display:flex; align-items:center; gap:10px;">
                    <div style="flex:1; height:1px; background:var(--border-color);"></div>
                    <span style="font-size:0.8rem; color:var(--secondary-text);">یان</span>
                    <div style="flex:1; height:1px; background:var(--border-color);"></div>
                </div>

                <button type="button" id="google-login-btn" class="gsi-material-button" style="width:100%; height:44px; justify-content:center;">
                    <div class="gsi-material-button-state"></div>
                    <div class="gsi-material-button-content-wrapper">
                        <div class="gsi-material-button-icon">
                            <svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" style="display: block;">
                                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>
                                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>
                                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
                                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
                                <path fill="none" d="M0 0h48v48H0z"></path>
                            </svg>
                        </div>
                        <span class="gsi-material-button-contents">چوونەژوورەوە بە گووگڵ (Sign in with Google)</span>
                    </div>
                </button>

                <p style="text-align: center; margin-top: 20px; font-size: 0.9em;">
                    هژمارا تە نینە؟ <a href="register.html" style="color: var(--blue-accent);">ئێکێ نوو چێکە</a>
                </p>
            </div>
        </div>
    </div>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="firebase-config.js"></script>
    <script src="auth-guard.js"></script>
    <script src="google-drive-integration.js"></script>
    <script src="login-script.js"></script>
</body>
</html>
