<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چوونەژوور (Login) | پەروەردە و کیمیا</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
</head>
<body>
    <div class="container" style="max-width: 470px;">
        <div id="login-modal" class="modal-overlay" style="display: flex; position: static; background: none;">
            <div class="modal-content" style="border-top: 5px solid var(--blue-accent); border-radius: 20px; padding: 28px 24px; text-align: right;">
                <div style="text-align:center; margin-bottom:20px;">
                    <div style="width:60px; height:60px; border-radius:16px; background:rgba(37,99,235,0.12); color:var(--blue-accent); display:inline-flex; align-items:center; justify-content:center; font-size:1.7rem; margin-bottom:10px;">
                        <i class="fas fa-sign-in-alt"></i>
                    </div>
                    <h2 class="modal-header" style="margin:0 0 6px; border:none; padding:0;">چوونەژوور (Login)</h2>
                    <p style="margin:0; font-size:0.86rem; color:var(--secondary-text);">
                        بچۆ ناڤ هەژمارا خۆ دا هەموو پۆست و زەبتێن تە لسەر هەر ئامێرەکێ بهێنەڤە
                    </p>
                </div>

                <form id="login-form">
                    <div class="form-group">
                        <label for="username"><i class="fas fa-user" style="color:var(--blue-accent);"></i> یوزەرنەیم (Username)</label>
                        <input type="text" id="username" placeholder="بۆ نموونە: ahmed_99" autocomplete="username" required style="direction:ltr; text-align:right;">
                    </div>
                    <div class="form-group">
                        <label for="password"><i class="fas fa-lock" style="color:var(--blue-accent);"></i> پاسوۆرد (Password)</label>
                        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
                    </div>

                    <p id="login-error" class="error-text" style="display:none; background:rgba(220,38,38,0.1); padding:10px 12px; border-radius:10px; font-weight:700;"></p>

                    <div class="form-actions" style="margin-top: 16px;">
                        <button type="submit" class="btn-save" style="width:100%; padding:12px; font-size:1rem; justify-content:center; border-radius:12px;">
                            <i class="fas fa-sign-in-alt"></i> چوونەژوور (Login)
                        </button>
                    </div>
                </form>

                <p style="text-align: center; margin-top: 20px; font-size: 0.92rem; color:var(--secondary-text);">
                    هەژمارا تە نینە؟ <a href="register.html" style="color: var(--green-accent); font-weight:700; text-decoration:none;">دروستکرنا هەژمارەکا نوو</a>
                </p>
                <p style="text-align: center; margin-top: 10px; font-size: 0.85rem;">
                    <a href="index.html" style="color: var(--secondary-text); text-decoration:none;">
                        <i class="fas fa-arrow-right"></i> زڤرین بۆ لاپەڕێ سەرەکی
                    </a>
                </p>
            </div>
        </div>
    </div>

    <script src="educational-data.js"></script>
    <script src="cloudflare-lessons.js"></script>
    <script src="login-script.js"></script>
</body>
</html>
