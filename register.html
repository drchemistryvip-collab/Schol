<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دروستکرنا هەژمارێ (Register) | پەروەردە و کیمیا</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <style>
        .role-choice-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 6px;
        }
        .role-choice-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 14px 10px;
            border-radius: 14px;
            border: 2px solid var(--border-color);
            background: var(--surface-color);
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }
        .role-choice-card:hover {
            border-color: var(--blue-accent);
        }
        .role-choice-card.active-student {
            border-color: #16a34a;
            background: rgba(22, 163, 74, 0.08);
        }
        .role-choice-card.active-teacher {
            border-color: #7c3aed;
            background: rgba(124, 58, 237, 0.08);
        }
    </style>
</head>
<body>
    <div class="container" style="max-width: 490px;">
        <div id="register-modal" class="modal-overlay" style="display: flex; position: static; background: none;">
            <div class="modal-content" style="border-top: 5px solid var(--green-accent); border-radius: 20px; padding: 28px 24px; text-align: right;">
                <div style="text-align:center; margin-bottom:20px;">
                    <div style="width:60px; height:60px; border-radius:16px; background:rgba(22,163,74,0.12); color:#16a34a; display:inline-flex; align-items:center; justify-content:center; font-size:1.7rem; margin-bottom:10px;">
                        <i class="fas fa-user-plus"></i>
                    </div>
                    <h2 class="modal-header" style="margin:0 0 6px; border:none; padding:0;">دروستکرنا هەژمارێ (Register)</h2>
                    <p style="margin:0; font-size:0.86rem; color:var(--secondary-text);">
                        وەک قوتابی یان مامۆستا خۆ تۆمار بکە دا هەموو تایبەتمەندییان بکاربینی
                    </p>
                </div>

                <form id="register-form">
                    <div class="form-group">
                        <label for="full_name"><i class="fas fa-id-card" style="color:#16a34a;"></i> ناڤێ تەمام (Full Name)</label>
                        <input type="text" id="full_name" placeholder="بۆ نموونە: ئەحمەد حسێن عەلی" required>
                    </div>

                    <div class="form-group">
                        <label for="username"><i class="fas fa-user" style="color:var(--blue-accent);"></i> یوزەرنەیم (Username)</label>
                        <input type="text" id="username" placeholder="بۆ نموونە: ahmed_99" autocomplete="username" required style="direction:ltr; text-align:right;">
                    </div>

                    <div class="form-group">
                        <label for="password"><i class="fas fa-lock" style="color:var(--blue-accent);"></i> پاسوۆرد (Password)</label>
                        <input type="password" id="password" placeholder="••••••••" autocomplete="new-password" required>
                    </div>

                    <div class="form-group">
                        <label><i class="fas fa-user-tag" style="color:#7c3aed;"></i> جۆرێ هەژمارێ هەلبژێرە:</label>
                        <div class="role-choice-grid">
                            <label class="role-choice-card active-student" id="reg-card-student">
                                <input type="radio" name="role" value="student" checked style="display:none;">
                                <i class="fas fa-user-graduate" style="font-size:1.65rem; color:#16a34a;"></i>
                                <strong style="font-size:0.95rem;">قوتابی (Student)</strong>
                                <span style="font-size:0.74rem; color:var(--secondary-text);">وانە، پسیار و نیشانکرن</span>
                            </label>
                            <label class="role-choice-card" id="reg-card-teacher">
                                <input type="radio" name="role" value="teacher" style="display:none;">
                                <i class="fas fa-chalkboard-teacher" style="font-size:1.65rem; color:#7c3aed;"></i>
                                <strong style="font-size:0.95rem;">مامۆستا (Teacher)</strong>
                                <span style="font-size:0.74rem; color:var(--secondary-text);">بەلاڤکرنا وانە و فایلان</span>
                            </label>
                        </div>
                    </div>

                    <!-- Conditional Teacher Secret Code -->
                    <div id="teacher-code-group" class="form-group" style="display:none; background:rgba(124,58,237,0.08); border:1.5px solid rgba(124,58,237,0.3); border-radius:12px; padding:14px; margin-bottom:14px;">
                        <label for="teacher_code" style="color:#6d28d9; font-weight:700;">
                            <i class="fas fa-key"></i> کۆدێ نهێنی یێ مامۆستایان (teacher_code)
                        </label>
                        <input type="password" id="teacher_code" placeholder="کۆدێ نهێنی یێ تایبەت ب مامۆستایان بنڤیسە...">
                        <small style="display:block; margin-top:5px; color:var(--secondary-text); font-size:0.78rem;">
                            تەنێ مامۆستایێن هەڵگرێ کۆدێ نهێنی دشێن هەژمارا مامۆستای دروست بکەن.
                        </small>
                    </div>

                    <p id="register-error" class="error-text" style="display:none; background:rgba(220,38,38,0.1); padding:10px 12px; border-radius:10px; font-weight:700;"></p>

                    <div class="form-actions" style="margin-top: 16px;">
                        <button type="submit" class="btn-save" style="width:100%; padding:12px; font-size:1rem; background:linear-gradient(135deg, #16a34a, #15803d); justify-content:center; border-radius:12px;">
                            <i class="fas fa-user-plus"></i> دروستکرنا هەژمارێ (Register)
                        </button>
                    </div>
                </form>

                <p style="text-align: center; margin-top: 20px; font-size: 0.92rem; color:var(--secondary-text);">
                    هەژمارا تە یا هەی؟ <a href="login.html" style="color: var(--blue-accent); font-weight:700; text-decoration:none;">ل ڤێرە بچۆ ژوور (Login)</a>
                </p>
                <p style="text-align: center; margin-top: 10px; font-size: 0.85rem;">
                    <a href="index.html" style="color: var(--secondary-text); text-decoration:none;">
                        <i class="fas fa-arrow-right"></i> زڤرین بۆ لاپەڕێ سەرەکی
                    </a>
                </p>
            </div>
        </div>
    </div>

    <script src="educational-data.js"></script>
    <script src="cloudflare-lessons.js"></script>
    <script src="register-script.js"></script>
</body>
</html>
